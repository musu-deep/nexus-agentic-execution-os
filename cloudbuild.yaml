steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/nexus:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/nexus:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - nexus-agentic-os
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/nexus:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
substitutions:
  _REGION: us-central1
  _REPO: nexus
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/nexus:$COMMIT_SHA"
